<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
    <h2>BMI Calculator</h2>
    
    <form id="bmiForm">
        
        <div class="form-group">
            <label for="gender">Gender</label>
            <select id="gender" name="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </div>

        <div class="form-group">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="1" max="120" placeholder="e.g., 22" required>
        </div>

        <div class="form-group">
            <label for="height">Height (cm)</label>
            <input type="number" id="height" name="height" step="0.1" placeholder="e.g., 175" required>
        </div>

        <div class="form-group">
            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" name="weight" step="0.1" placeholder="e.g., 70" required>
        </div>

        <button type="submit">Calculate BMI</button>
        
    </form>
    <div class="result-section">
        <h3>Your BMI: <span id="bmiValue">--</span></h3>
        <p id="bmiStatus">Enter your details above to calculate.</p>
    </div>
</div>
</body>
<script src="script.js"></script>
</html>
